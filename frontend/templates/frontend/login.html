
{% extends "frontend/base.html" %}
{% load static %}

{% block title %}
    Login | Restaurant Management System
{% endblock %}


{% block content %}

<section class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Login
                    </h2>


                    <div
                        id="login-message"
                    ></div>


                    <form id="login-form">

                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Username
                            </label>

                            <input
                                type="text"
                                id="username"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-warning w-100"
                        >
                            Login
                        </button>

                    </form>


                    <p class="text-center mt-3 mb-0">

                        Don't have an account?

                        <a
                            href="{% url 'frontend:register' %}"
                        >
                            Register
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}


{% block scripts %}

<script
    src="{% static 'frontend/js/login.js' %}"
></script>

{% endblock %}
