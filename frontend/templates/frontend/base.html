{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Restaurant Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'frontend:home' %}">RestaurantMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="{% url 'frontend:home' %}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'frontend:menu' %}">Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'frontend:cart' %}">Cart</a></li>
                <li id="reservations-nav-item" class="nav-item d-none"><a class="nav-link" href="{% url 'frontend:reservations' %}">Reservations</a></li>
                <li id="orders-nav-item" class="nav-item d-none"><a class="nav-link" href="{% url 'frontend:orders' %}">My Orders</a></li>
                <li id="login-nav-item" class="nav-item"><a class="nav-link" href="{% url 'frontend:login' %}">Login</a></li>
                <li id="register-nav-item" class="nav-item ms-lg-2"><a class="btn btn-warning" href="{% url 'frontend:register' %}">Register</a></li>
                <li id="logout-nav-item" class="nav-item ms-lg-2 d-none"><button type="button" class="btn btn-outline-light" onclick="logout()">Logout</button></li>
            </ul>
        </div>
    </div>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container"><p class="mb-0">© 2026 Restaurant Management System</p></div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'frontend/js/api.js' %}"></script>
<script src="{% static 'frontend/js/auth.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
