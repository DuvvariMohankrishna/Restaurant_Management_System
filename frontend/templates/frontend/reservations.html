{% extends "frontend/base.html" %}
{% load static %}


{% block title %}
    Reservations | Restaurant Management System
{% endblock %}


{% block content %}

<section class="container my-5">

    <div class="row">

        <!-- Reservation Form -->

        <div class="col-lg-5 mb-4">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        Reserve a Table
                    </h2>


                    <div
                        id="reservation-message"
                    ></div>


                    <form
                        id="reservation-form"
                    >

                        <div class="mb-3">

                            <label
                                for="reservation-date"
                                class="form-label"
                            >
                                Date
                            </label>

                            <input
                                type="date"
                                id="reservation-date"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="reservation-time"
                                class="form-label"
                            >
                                Time
                            </label>

                            <input
                                type="time"
                                id="reservation-time"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="table-number"
                                class="form-label"
                            >
                                Table Number
                            </label>

                            <input
                                type="number"
                                id="table-number"
                                class="form-control"
                                min="1"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label
                                for="number-of-guests"
                                class="form-label"
                            >
                                Number of Guests
                            </label>

                            <input
                                type="number"
                                id="number-of-guests"
                                class="form-control"
                                min="1"
                                max="20"
                                required
                            >

                        </div>


                        <button
                            type="button"
                            id="check-availability-btn"
                            class="btn btn-outline-primary w-100 mb-3"
                        >
                            Check Availability
                        </button>


                        <button
                            type="submit"
                            class="btn btn-warning w-100"
                        >
                            Reserve Table
                        </button>

                    </form>

                </div>

            </div>

        </div>


        <!-- My Reservations -->

        <div class="col-lg-7">

            <h2 class="mb-4">
                My Reservations
            </h2>


            <div
                id="reservations-list"
                class="row g-3"
            >

                <div class="col-12">

                    <p>
                        Loading reservations...
                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}


{% block scripts %}

<script
    src="{% static 'frontend/js/reservations.js' %}"
></script>

{% endblock %}
