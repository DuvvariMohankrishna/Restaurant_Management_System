{% extends "frontend/base.html" %}
{% load static %}


{% block title %}
    Menu | Restaurant Management System
{% endblock %}


{% block content %}

<section class="py-5">

    <div class="container">

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                Our Menu
            </h1>

            <p class="lead text-muted">

                Explore our delicious dishes and
                add your favorites to your cart.

            </p>

        </div>


        <!-- Menu items will be loaded here -->

        <div
            id="menu-container"
            class="row g-4"
        >

            <div class="col-12 text-center">

                <div
                    class="spinner-border"
                    role="status"
                >

                    <span class="visually-hidden">
                        Loading...
                    </span>

                </div>

                <p class="mt-3">
                    Loading menu...
                </p>

            </div>

        </div>

    </div>

</section>

{% endblock %}


{% block scripts %}

<script
    src="{% static 'frontend/js/menu.js' %}"
></script>

{% endblock %}
